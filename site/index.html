  <script>
    // Last-resort safety net: if ANY uncaught error happens before the app
    // shell replaces this overlay, surface it here immediately instead of
    // leaving the user staring at "Loading source data..." forever.
    window.addEventListener('error', function (e) {
      var overlay = document.getElementById('boot-overlay');
      if (!overlay) return; // app already booted; not our concern
      overlay.innerHTML = '<div style="max-width:620px;text-align:center;padding:28px;">' +
        '<div style="font-size:42px;margin-bottom:12px;">\u26A0</div>' +
        '<div style="font-family:Sora,sans-serif;font-weight:700;font-size:18px;margin-bottom:8px;">A script failed to load or run</div>' +
        '<div style="font-size:13px;color:#b9c0e8;line-height:1.6;margin-bottom:8px;">' + (e.message || 'Unknown script error') + '</div>' +
        '<div style="font-size:11.5px;color:#7d84b8;margin-bottom:18px;">' + (e.filename ? (e.filename + ':' + e.lineno) : '') + '</div>' +
        '<button onclick="location.reload()" style="border:0;border-radius:10px;padding:10px 18px;cursor:pointer;">Reload Dashboard</button></div>';
    });
    // Nudge the user toward the local-server route if boot is taking unusually long.
    setTimeout(function () {
      var nudge = document.getElementById('boot-nudge');
      if (nudge && document.getElementById('boot-overlay')) {
        nudge.style.display = 'block';
        nudge.textContent = "Still loading? If you opened this file directly (a file:// address in the URL bar), your browser's storage can be unreliable that way. Closing this and running it via a local server (see README) usually fixes it instantly.";
      }
      var btn = document.getElementById('boot-force-continue');
      if (btn && document.getElementById('boot-overlay')) btn.style.display = 'inline-block';
    }, 4000);
  </script>
